<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body
        {
            background-color: rgb(216, 147, 19);
        }
        .class1
        {
            background-color: rgb(114, 114, 218);
            color: black;
            padding: 10px;
        }
        p
        {
            display: inline;
        }
        a
        {
            display: block;
        }
        div
        {
            background-color: rgb(85, 148, 185);
            padding: 10px;
        }
        span
        {
            background-color: rgb(139, 8, 8);
            font-weight: bold;
            
        }
    </style>
</head>
<body>
    <div>
        <p class="class1">lorem ipsum dolor sit amet</p>
        <p class="class1"><span>lorem</span> ipsum dolor sit amet</p>
        <a href="https://www.google.com" class="class1">Google</a>
        <a href="" class="class1">Lugar nenhum</a>
    </div>
</body>
</html>
