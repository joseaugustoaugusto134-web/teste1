<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        for(let i =0; i<4; i++)
        {
            let idade = Number(prompt("digite sua idade, pessoa: " + Number(i+1)));
            let nome = prompt("Qual o seu nome?");
            if(idade >= 18)
            {
                document.write(`${nome}, você é maior de idade!!!!<hr>`)
            }
            else
            {
                document.write(`sai do meu site pentelho! ${nome}, você é um pé de rato!<hr>`)
            }
        }
    </script>

</body>
</html>
